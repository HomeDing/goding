<!doctype html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Board</title>
  <link rel='icon' type='image/png' href='/favicon48.png' sizes='48x48'>
  <meta name='application-name' content='Ding'>
  <meta name='msapplication-config' content='/browserconfig.xml'>
  <meta name='msapplication-TileColor' content='#2b5797'>
  <meta name='msapplication-TileImage' content='/favicon144.png'>
  <link rel='apple-touch-icon' sizes='180x180' href='/favicon180.png'>
  <meta name='mobile-web-app-capable' content='yes'>
  <link rel='manifest' href='/site.webmanifest'>
  <meta name='theme-color' content='#ffffff'>
  <link content-type='text/css' href='/iotstyle.css' rel='stylesheet' defer='defer'>
  <script type='module' src='/micro.js'></script>
  <script src='/sfc/loader.js'></script>
  <script>window.loadComponent("/bundle.sfc").then(() => { window.loadComponent("hdw-generic,hdw-air,hdw-reference,hdw-schedule,hdw-switch,hdw-digitalvalue,hdw-onoff", "/hdw") })</script>
  <style>
    svg.setconfig {
      position: absolute;
      top: .5rem;
      right: .5rem;
      height: 1.4rem;
      width: 1.4rem;
      background-size: 1.4rem
    }

    svg.fullscreen {
      position: absolute;
      top: .5rem;
      right: 2.5rem;
      height: 1.4rem;
      width: 1.4rem;
      background-size: 1.4rem
    }

    #panl,
    img {
      user-select: none
    }

    input:invalid,
    select:invalid {
      border-color: red
    }
  </style>
</head>

<body class='sitelayout' style='width:100%;--layout-gap:0;--main-back:transparent'><u-toast></u-toast>
  <header>
    <h1>Board</h1>
  </header>
  <nav class='navbar'><a href='/'>Home</a> <a href='/board.htm'>Board</a> <a href='/microide.htm'>IDE</a> <a href='/log.htm'>Log</a> <span class='gap'></span> <button id='sysButton'>sys</button> <button id='addButton'>+</button></nav>
  <main>
    <div id='panl' class='card-container col365' style='--card-height:auto'></div>
  </main><template id='cardHeader'>
    <div class='header'><svg class='icon'>
        <use href='./icons.svg#${type}' />
      </svg>
      <h3 u-text='title'></h3>
      <h4 u-text='description'></h4><svg class='setconfig'>
        <use href='./icons.svg#config' />
      </svg>
    </div>
  </template>
  <div id='u-templates' style='display:none'>
    <div u-control='modal' u-is='modal'>
      <div class='modalBack' u-action='close'></div>
      <div class='modalFrame' class='modal-object'></div>
    </div>
    <div class='card' u-control='generic' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='main'>
        <div class='form-grid'><label>Value:</label><output u-text='value'></output></div>
      </div>
    </div><hdw-digitalvalue class='card' u-control='digitalvalue' microid='${id}'></hdw-digitalvalue><hdw-switch class='card' u-control='switch' id='${id}' microid='${id}'></hdw-switch><hdw-air class='card' u-control='air' id='${id}' microid='${id}'></hdw-air><hdw-reference class='card' u-control='reference' id='${id}' microid='${id}'></hdw-reference><hdw-schedule class='card' u-control='schedule' id='${id}' microid='${id}'></hdw-schedule>
    <div class='card' u-control='dstime' id='${id}' u-is='dstime' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='main'>
        <div class='form-grid'><label>ReadTime:</label><input u-value='readtime' type='time' step='1'> <label>Now:</label><output u-text='now'></output><label>set Time:</label><output class='now'></output></div>
        <div class='footer'><button style='float:right'>set</button></div>
      </div>
    </div>
    <div class='card' u-control='value' id='${id}' u-is='value' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='block form-grid'><label>value:</label> <span><input type='range' u-value='value'><output u-text='value'></output></span></div>
    </div>
    <div class='card' u-control='select' id='${id}' u-is='select' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='main'><select></select></div>
    </div>
    <div class='card' u-control='rfcodes' microid='${id}' u-is='generic'><u-include ref='#cardHeader'></u-include>
      <div class='main'>
        <div><label>Last Code:</label></div>
        <pre>[<span u-text='value'style='user-select:text'></span>]</pre>
      </div>
    </div>
    <div class='card' u-control='color' id='${id}' u-is='color' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='block form-grid'><label>value:</label><output name='value'></output><label>color:</label><input type='color' name='color'> <label style='display:none'>white:</label>
        <div style='display:none'><input type='range' max='255' name='white'><output name='white'></output></div><label>brightness:</label>
        <div><input type='range' max='100' name='brightness'><output name='brightness'></output></div><label>duration:</label>
        <div><input type='range' max='12000' step='100' name='duration'><output name='duration'></output></div>
      </div>
      <div class='footer form-actions'><button u-action='mode' value='fade'>fade</button> <button u-action='mode' value='fix'>fix</button> <button u-action='mode' value='pulse'>pulse</button> <button u-action='mode' value='wheel'>wheel</button></div>
    </div>
    <div class='card' u-control='stripe' id='${id}' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='block form-grid'><label>mode:</label><output u-text='mode'></output><label>duration:</label>
        <div><input type='range' max='20000' step='100' u-value='duration' u-units='ms'><output u-value='duration'></output></div><label>Effect Length:</label>
        <div><input type='range' max='255' u-value='effectlength'><output u-value='effectlength'></output></div>
      </div>
      <div class='footer form-actions'><button u-action='mode' value='flow'>flow</button></div>
    </div>
    <div class='card' u-control='light' id='${id}' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='main'><span u-color='value' class='border' style='width:4rem;height:4rem;float:right;border-radius:50%'></span>
        <div class='form-grid'><label>value:</label><output u-text='value'></output><label>brightness:</label><output u-text='brightness'></output></div>
      </div>
    </div>
    <div class='card' u-control='tm1637' id='${id}' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='main'>
        <div style='text-align:center'><span u-text='value' style='font-size:4rem;font-style:italic'></span></div>
        <div class='form-grid'><label>brightness:</label><output u-text='brightness'></output></div>
      </div>
    </div>
    <div class='card' u-control='ina2xx' id='${id}' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='block form-grid'><label>Voltage:</label><output u-text='voltage'></output><label>Current:</label><output u-text='current'></output><label>Power:</label><output u-text='power'></output></div>
    </div>
    <div class='card' u-control='bl0937' id='${id}' u-is='bl0937' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='main'>
        <table style='width:100%;font-size:2rem'>
          <tr>
            <td><span u-text='power'></span> W</td>
            <td style='display:none'><span u-text='current'></span> mA</td>
            <td style='display:none'><span u-text='voltage'></span> V</td>
            <td><span u-text='energy'></span> Wh</td>
          </tr>
        </table>mode: <button u-action='mode' value='current'>current</button> <button u-action='mode' value='voltage'>voltage</button>
      </div>
    </div>
    <div class='card' u-control='radio' id='${id}' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='block form-grid'><label>Frequency:</label> <span><output u-text='frequency' style='width:7ch'></output><button u-action='seek' value='0'>&lt;&lt;</button> <button u-action='seek' value='1'>&gt;&gt;</button> </span><label>RSSI:</label><output u-text='rssi'></output><label>SNR:</label><output u-text='snr'></output><label>station:</label><output u-text='stationname'></output></div>
      <div class='footer form-actions'><button u-action='frequency' value='9440'>hr1</button> <button u-action='frequency' value='8930'>hr3</button> <button u-action='frequency' value='10300'>AB</button> <button u-action='frequency' value='8840'>B2</button></div>
    </div>
    <div class='card' u-control='scene' microid='${id}' u-is='scene'>
      <div class='header'>
        <h3>Scenes</h3>
      </div>
      <div class='block form-actions'></div>
    </div>
    <div class='card' u-control='my' id='${id}' u-is='generic' microid='${id}'><u-include ref='#cardHeader'></u-include>
      <div class='block form-grid'><label>Pin:</label><output u-text='pin'></output><label>Interval:</label><output u-text='interval'></output></div>
    </div>
    <div class='card' u-control='log' u-is='log' microid='${id}'>
      <div class='header'><svg class='icon'>
          <use href='./icons.svg#${type}' />
        </svg>
        <h3 u-text='title'></h3>
        <h4 u-text='description'></h4><svg class='fullscreen'>
          <use href='./icons.svg#fullscreen' />
        </svg> <svg class='setconfig'>
          <use href='./icons.svg#config' />
        </svg>
      </div>
      <div class='main'><u-linechart style='width:100%'></u-linechart></div>
    </div>
  </div>
  <script type='module'>import { hub, micro, fetchJSON, fetchText, getHashParams, toBool, setAttr, jsonParse } from "/micro.js";
  window.hub = hub, window.setAttr = setAttr, window.toBool = toBool,
  window !== window.top && (document.querySelector("header").style.display = "none", document.querySelector("nav.navbar").style.display = "none");
  const uElements = { defs: {}, impl: [], env: {}, config: {}, state: {} }, REFRESH_INTERVAL = 4e3;
  var timer, panelObj = document.querySelector("#panl"), addObj = document.getElementById("addButton"), sysObj = document.getElementById("sysButton"), params = { sys: !1 }; 
  async function loadPlugins() { var e; return document.querySelector("dialog#newElement") || (e = fetchText("./board-new.htm").then(e => { document.body.appendChild(document.createRange().createContextualFragment(e)),
    document.querySelectorAll("[u-is]").forEach(e => micro.attach(e)) })), e } function updateStateNow() { window.clearTimeout(timer), fetchJSON("/api/state").then(e => hub.publishObj(e)).finally(() =>
    timer = window.setTimeout(updateStateNow, 4e3)) } function loaded() { var e = fetchJSON("/elements.json").then(e => uElements.defs = e), t = fetchJSON("/env.json").then(e => uElements.env = e), 
    n = fetchJSON("/config.json").then(e => uElements.config = e); fetchJSON("/api/state").then(e => uElements.state = e); params = getHashParams({ sys: !1 }); var o = micro.loadFile("/board-templates.htm");
     hub.subscribe("/*/*", function(e, t, n) { if (e && (e = e.toLowerCase(), !document.querySelector("[microID='" + e + "']"))) { var o = e.split("/")[1], i = { icon: o, id: e, type: o }, 
     a = uElements.defs[o]; if (toBool(params.sys) || a && 0 == toBool(a.sys))
  { a && a.icon && (i.icon = a.icon); var s = micro.insertTemplate(panelObj, o, i); s || (o = a?.ui || "generic", s = micro.insertTemplate(panelObj, o, i)) } } }), hub.subscribe("/device/*?name",
   function(e, t, n) { document.title = n, document.querySelector("meta[name=application-name]").content = n }), Promise.allSettled([o, e, t, n]).then(function() { uElements.env && (hub.write("env", JSON.stringify(uElements.env)), hub.publishObj(uElements.env)); const e = uElements.config;
  if (e) { for (var t in e) for (var n in e[t]) e[t][n].title || (e[t][n].title = t + "/" + n); hub.write("config", JSON.stringify(e)), hub.publishObj(e) } hub.publishObj(uElements.state),
  timer = window.setTimeout(updateStateNow, 4e3), fetchJSON("/api/elements").then(e => uElements.impl = e), loadPlugins() }) } window.addEventListener("hashchange", function() { window.location.reload() }), sysObj.addEventListener("click", function(e) { params.sys = !toBool(params.sys), window.location.hash = "sys=" + params.sys }), addObj.addEventListener("click", async function(e) { await loadPlugins(), document.querySelector("dialog#newElement").showModal() }), window.updateState = function() { window.clearTimeout(timer), timer = window.setTimeout(updateStateNow, 200) },
  window.addEventListener("DOMContentLoaded", loaded)</script>
</body>

</html>
